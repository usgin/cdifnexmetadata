[project]
name = "cdifnexmetadata"
version = "0.1.0"
description = "Extract CDIF metadata from NeXus-formatted HDF5 files"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [
    { name = "USGIN" },
]
keywords = ["nexus", "hdf5", "metadata", "cdif", "schema.org", "json-ld"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
# JSON Schema + SHACL validation of emitted documents.
validate = [
    "jsonschema[format]>=4.23",
    "pyshacl>=0.26",
    "rdflib>=7.0",
    "pyld>=2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cdifnexmetadata = "cdifnexmetadata.cli:main"

[project.urls]
Homepage = "https://github.com/usgin/cdifnexmetadata"
Issues = "https://github.com/usgin/cdifnexmetadata/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdifnexmetadata"]

# The bundled SSSOM crosswalks under src/cdifnexmetadata/data/ ship because
# they sit inside the package directory named above -- hatchling includes
# non-Python files there by default. A force-include table pointing at the
# same directory added every file a second time and broke the wheel build
# outright ("A second file is being added to the wheel archive at the same
# path"), so the package could be run from a checkout but never installed.
