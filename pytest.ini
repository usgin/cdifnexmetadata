[pytest]
testpaths = tests
# The suite shares fixtures via `from tests.test_map import ...`, which
# needs the repo root importable. `python -m pytest` adds it; the
# `pytest` console script does not, so `uv run pytest` failed
# collection while `uv run python -m pytest` passed. This makes both
# work.
pythonpath = .
markers =
    network: touches GitHub; deselect with -m "not network"
